name: Set up Java and Gradle
description: >-
  Installs the project's JDK and the Gradle wrapper with validation and caching.
  ci.yml and sonarqube.yml both need this pair, and keeping it in one place also
  keeps the pinned action SHAs in one place for Dependabot to maintain.

runs:
  using: composite
  steps:
    - name: Set up Java 25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: '25'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-provider: basic
        validate-wrappers: true
