version: 2

updates:
  # Keeps the SHA-pinned third-party actions current. Dependabot rewrites both
  # the SHA and the trailing version comment, so pinning stays maintainable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"

  # Gradle dependencies are locked (see ci.yml), and Dependabot regenerates
  # gradle.lockfile along with the version in build.gradle — including
  # transitive changes. #36, for example, bumped springdoc 3.0.3 -> 3.1.0 and
  # carried swagger-annotations 2.2.47 -> 2.2.52 and swagger-ui 5.32.2 ->
  # 5.32.11 through the lockfile with it. No manual `--write-locks` step is
  # needed to turn one of these green.
  #
  # (An earlier version of this comment claimed the opposite and told you to
  # regenerate the locks by hand. That was wrong. The real reason the first
  # batch of these pull requests went red was SONAR_TOKEN being unavailable to
  # Dependabot runs, fixed in #41 — nothing to do with locking.)
  #
  # Grouping is for review volume, not for any manual step.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "io.micrometer:*"
      test-tooling:
        patterns:
          - "org.testcontainers:*"
          - "org.junit*"
