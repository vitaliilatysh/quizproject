name: Apply P2 coverage payload

on:
  push:
    branches:
      - vitaliilatysh-patch-1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'vitaliilatysh'
    runs-on: ubuntu-latest
    steps:
      - name: Check out publishing branch
        uses: actions/checkout@v4
        with:
          ref: vitaliilatysh-patch-1

      - name: Apply P2 test payload
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath .p2-tests.zip -DestinationPath . -Force
          Remove-Item -LiteralPath .p2-tests.zip -Force
          git checkout -- .github/workflows/sonarqube.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Close P2 coverage gaps"
          git push origin HEAD:vitaliilatysh-patch-1
