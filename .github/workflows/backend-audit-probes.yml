name: Backend audit probes

on:
  push:
    branches:
      - codex/backend-audit-probes-20261018

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-java-gradle
      - name: Generate ephemeral test key
        shell: bash
        run: |
          test_key="$(openssl rand -base64 32)"
          echo "::add-mask::$test_key"
          echo "JWT_SECRET=$test_key" >> "$GITHUB_ENV"
      - name: Run HTTP probes
        run: ./gradlew :api:test --tests '*BackendAuditProbeTest' --no-daemon
      - name: Run MySQL concurrency probes
        run: ./gradlew :api:integrationTest --tests '*BackendAuditProbeIntegrationTest' --no-daemon
      - name: Print probe results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for path in pathlib.Path("api/build/test-results").rglob("TEST-*BackendAuditProbe*.xml"):
              root = ET.parse(path).getroot()
              print(path, {name: root.get(name) for name in ("tests", "failures", "errors")})
              for item in root.iter("testcase"):
                  for failure in item.findall("failure"):
                      print(item.get("name"), failure.get("message"))
              for output in root.iter("system-out"):
                  for line in (output.text or "").splitlines():
                      if "AUDIT_CONFIRMED:" in line:
                          print(line)
          PY
