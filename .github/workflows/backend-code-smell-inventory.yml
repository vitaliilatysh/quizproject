name: Backend code smell inventory
on:
  push:
    branches: [codex/fix-backend-code-smells-20261018]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read backend issue inventory and metrics
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          queries = [
              ("BRANCHES", "/api/project_branches/list", {"project": "vitaliilatysh_quizproject"}),
              ("METRICS", "/api/measures/component", {
                  "component": "vitaliilatysh_quizproject", "branch": "master",
                  "metricKeys": "code_smells,sqale_rating,sqale_index,new_code_smells",
              }),
              ("ALL_ISSUES", "/api/issues/search", {
                  "componentKeys": "vitaliilatysh_quizproject", "branch": "master", "ps": "500",
              }),
          ]
          for label, path, params in queries:
              request = urllib.request.Request(
                  "https://sonarcloud.io" + path + "?" + urllib.parse.urlencode(params),
                  headers={"Authorization": "Bearer " + os.environ["SONAR_TOKEN"]},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
              if label == "ALL_ISSUES":
                  print(label + "_TOTAL=" + str(data.get("total", data.get("paging", {}).get("total"))))
                  for issue in data.get("issues", []):
                      print("ISSUE=" + json.dumps({key: issue.get(key) for key in (
                          "key", "rule", "type", "severity", "component", "line", "message",
                          "textRange", "effort", "status", "issueStatus", "resolution", "impacts",
                      )}))
              else:
                  print(label + "=" + json.dumps(data))
          PY
