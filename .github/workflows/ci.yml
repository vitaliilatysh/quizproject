name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 25, MySQL, Redis and manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.1

      # Do NOT add a `--write-locks` step here. Gradle enforces the committed
      # lockfiles while resolving a locked configuration, so the build below
      # fails when a dependency resolves to anything other than what is locked.
      # Regenerating the locks in CI would silently accept whatever upstream
      # currently serves, which is exactly what the lockfiles exist to prevent.
      # Changing a dependency means running `./gradlew --write-locks` locally
      # and committing the updated lockfiles.
      - name: Build, test, and package
        run: ./gradlew clean :api:check :api:integrationTest :api:bootJar --no-daemon

      - name: Render Kubernetes manifests
        shell: bash
        run: |
          kubectl kustomize deploy/kubernetes/backend > backend.yaml
          kubectl kustomize deploy/kubernetes/overlays/local > local.yaml
          kubectl kustomize deploy/kubernetes/overlays/production > production.yaml
          kubectl kustomize deploy/kubernetes/monitoring > monitoring.yaml

          grep --quiet 'name: quiz-api' backend.yaml
          grep --quiet 'name: quiz-redis' backend.yaml
          grep --quiet 'kind: NetworkPolicy' backend.yaml
          grep --quiet 'prometheus.io/scrape: "true"' backend.yaml
          grep --quiet 'image: quizproject-api:local' local.yaml
          grep --quiet 'image: ghcr.io/vitaliilatysh/quizproject:master' production.yaml
          grep --quiet 'kind: ServiceMonitor' monitoring.yaml
          grep --quiet 'alert: QuizApiUnavailable' monitoring.yaml
