name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 25, MySQL, Redis and manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test release gate and Dependabot automation
        run: python3 -B -m unittest discover -s .github/scripts -v


      - name: Validate DigitalOcean deployment configuration
        env:
          APP_IMAGE: ghcr.io/vitaliilatysh/quizproject@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DEPLOY_ENV: validation
        run: |
          bash -n deploy/digitalocean/ship.sh deploy/digitalocean/rollout.sh
          docker compose --env-file deploy/digitalocean/.env.example \
            --file deploy/digitalocean/compose.yaml config --quiet

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      # Do NOT add a `--write-locks` step here. Gradle enforces the committed
      # lockfiles while resolving a locked configuration, so the build below
      # fails when a dependency resolves to anything other than what is locked.
      # Regenerating the locks in CI would silently accept whatever upstream
      # currently serves, which is exactly what the lockfiles exist to prevent.
      # Changing a dependency means running `./gradlew --write-locks` locally
      # and committing the updated lockfiles.
      - name: Build, test, and package
        run: ./gradlew clean :api:check :api:integrationTest :api:bootJar --no-daemon

      - name: Upload generated OpenAPI contract
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-contract
          path: api/build/openapi/openapi.json
          if-no-files-found: error
          retention-days: 30

  retire-legacy-deploy:
    name: Retire legacy deployment workflow
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Disable the retired deployment entry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.path == ".github/workflows/deploy.yml" and .state == "active") | .id' |
          while IFS= read -r workflow_id; do
            [[ "$workflow_id" =~ ^[0-9]+$ ]]
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/disable"
            echo "Disabled the legacy deployment workflow (${workflow_id})."
          done
