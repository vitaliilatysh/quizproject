name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 25, MySQL, Redis and manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.36.1

      - name: Refresh dependency lock state
        run: ./gradlew dependencies :api:dependencies --write-locks --no-daemon && cat gradle.lockfile && cat api/gradle.lockfile

      - name: Build, test, and package
        run: ./gradlew clean :api:check :api:integrationTest :api:bootJar --no-daemon

      - name: Render Kubernetes manifests
        shell: bash
        run: |
          kubectl kustomize deploy/kubernetes/backend > backend.yaml
          kubectl kustomize deploy/kubernetes/overlays/local > local.yaml
          kubectl kustomize deploy/kubernetes/overlays/production > production.yaml

          grep --quiet 'name: quiz-api' backend.yaml
          grep --quiet 'name: quiz-redis' backend.yaml
          grep --quiet 'kind: NetworkPolicy' backend.yaml
          grep --quiet 'image: quizproject-api:local' local.yaml
          grep --quiet 'image: ghcr.io/vitaliilatysh/quizproject:master' production.yaml
