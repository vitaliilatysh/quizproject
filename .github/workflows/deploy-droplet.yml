# Deploys the stack to the DigitalOcean droplet with docker compose over SSH.
#
# The Kubernetes workflow (deploy.yml) is untouched; this is the other target.
# Same rules as there: only an immutable image is deployed (a digest, resolved
# once on the runner and signature-checked before anything leaves it), and the
# `production` environment is where a reviewer can be required.
#
# Secrets for the application live in /opt/quizproject/.env on the droplet and
# never pass through GitHub. What GitHub holds is only how to reach the droplet.
name: Deploy to DigitalOcean

on:
  workflow_run:
    workflows: ["Backend container delivery"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      api_tag:
        description: "Backend image tag (default: sha- of the commit checked out)"
        required: false
        type: string
      web_tag:
        description: "Frontend image tag"
        required: false
        default: main
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the droplet
    # Automatic deploys after a merge are opt-in: set the repository variable
    # DROPLET_DEPLOY_ENABLED to "true" once the droplet is prepared. A manual run
    # always works. The other two conditions are the same trust boundary as in
    # deploy.yml: only a push, and only from this repository, never a fork's
    # branch that happens to be called master.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (vars.DROPLET_DEPLOY_ENABLED == 'true'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      API_IMAGE_NAME: ghcr.io/vitaliilatysh/quizproject
      WEB_IMAGE_NAME: ghcr.io/vitaliilatysh/quizproject-web
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}
      DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
      DROPLET_SSH_KNOWN_HOSTS: ${{ secrets.DROPLET_SSH_KNOWN_HOSTS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check the droplet credentials are configured
        shell: bash
        run: |
          missing=0
          for name in DROPLET_HOST DROPLET_USER DROPLET_SSH_KEY DROPLET_SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ${name} is not set for the production environment."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "See deploy/droplet/README.md for how to create them."
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag can be repointed between the signature check and the deploy, so each
      # tag is resolved to a digest exactly once, here, and only the digest is
      # verified and sent to the droplet.
      - name: Resolve both images to digests
        shell: bash
        env:
          API_TAG: ${{ github.event.inputs.api_tag }}
          WEB_TAG: ${{ github.event.inputs.web_tag }}
        run: |
          resolve() {
            local image="$1" name="$2" digests ref
            docker pull "${image}" >/dev/null
            # A here-string rather than a pipe: `grep -m 1` closing early would
            # SIGPIPE docker under pipefail and fail the step on a successful match.
            digests="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${image}")"
            ref="$(grep -m 1 "^${name}@" <<<"${digests}")"
            test -n "${ref}"
            printf '%s' "${ref}"
          }

          API_REF="$(resolve "${API_IMAGE_NAME}:${API_TAG:-sha-${DEPLOY_SHA}}" "${API_IMAGE_NAME}")"
          WEB_REF="$(resolve "${WEB_IMAGE_NAME}:${WEB_TAG:-main}" "${WEB_IMAGE_NAME}")"
          echo "API_REF=${API_REF}" >> "${GITHUB_ENV}"
          echo "WEB_REF=${WEB_REF}" >> "${GITHUB_ENV}"
          echo "Backend:  ${API_REF}"
          echo "Frontend: ${WEB_REF}"

      - name: Verify both image signatures before deploying
        shell: bash
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp \
              "^https://github.com/vitaliilatysh/quizproject/\.github/workflows/container\.yml@" \
            "${API_REF}" > /dev/null
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp \
              "^https://github.com/vitaliilatysh/quizproject-web/\.github/workflows/container\.yml@" \
            "${WEB_REF}" > /dev/null
          echo "Both signatures verified."

      - name: Prepare SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DROPLET_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host key is pinned from a secret instead of trusted on first use,
          # so a spoofed droplet cannot receive the deploy.
          printf '%s\n' "${DROPLET_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy the compose files to the droplet
        shell: bash
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            deploy/droplet/compose.yaml deploy/droplet/Caddyfile \
            deploy/droplet/runtime-config.js deploy/droplet/deploy.sh \
            "${DROPLET_USER}@${DROPLET_HOST}:/opt/quizproject/"

      - name: Deploy
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "${DROPLET_USER}@${DROPLET_HOST}" \
            "chmod +x /opt/quizproject/deploy.sh && /opt/quizproject/deploy.sh '${API_REF}' '${WEB_REF}'"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Deploy to DigitalOcean"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Backend | \`${API_REF:-unresolved}\` |"
            echo "| Frontend | \`${WEB_REF:-unresolved}\` |"
            echo "| Commit | \`${DEPLOY_SHA}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove the SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/deploy_key
