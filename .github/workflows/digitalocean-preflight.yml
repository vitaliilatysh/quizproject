name: DigitalOcean preflight

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/digitalocean-preflight.yml
      - deploy/digitalocean/preflight.py

permissions:
  contents: read

concurrency:
  group: digitalocean-preflight
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect existing DigitalOcean stack
    if: github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted inspection code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify SSH access and inspect the existing stack
        env:
          DO_HOST: ${{ vars.DO_HOST }}
          DO_SSH_USER: ${{ vars.DO_SSH_USER || 'deploy' }}
          DO_SSH_PORT: ${{ vars.DO_SSH_PORT || '22' }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DO_HOST DO_SSH_USER DO_SSH_KEY DO_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure ${name} in the production GitHub environment."
              exit 1
            fi
          done
          [[ "$DO_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DO_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DO_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          ((10#$DO_SSH_PORT >= 1 && 10#$DO_SSH_PORT <= 65535))
          umask 077
          credentials=$(mktemp -d "$RUNNER_TEMP/quiz-preflight.XXXXXXXX")
          trap 'rm -rf -- "$credentials"' EXIT
          printf '%s\n' "$DO_SSH_KEY" > "$credentials/key"
          printf '%s\n' "$DO_KNOWN_HOSTS" > "$credentials/known_hosts"
          unset DO_SSH_KEY DO_KNOWN_HOSTS
          ssh -T -p "$DO_SSH_PORT" -i "$credentials/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$credentials/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "$DO_SSH_USER@$DO_HOST" 'python3 -B -' < deploy/digitalocean/preflight.py
