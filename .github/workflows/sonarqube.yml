name: SonarQube analysis

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    name: Inspect SonarCloud security findings
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - name: Read current master security findings
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          
          project = "vitaliilatysh_quizproject"
          branch = "master"
          
          def read_api(path, parameters):
              query = urllib.parse.urlencode(parameters)
              request = urllib.request.Request(
                  "https://sonarcloud.io/api/" + path + "?" + query,
                  headers={"Authorization": "Bearer " + os.environ["SONAR_TOKEN"]},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          
          gate = read_api("qualitygates/project_status", {"projectKey": project, "branch": branch})
          print("QUALITY_GATE_DIAGNOSTICS " + json.dumps(gate["projectStatus"]))
          
          page = 1
          while True:
              result = read_api("issues/search", {
                  "componentKeys": project, "branch": branch,
                  "resolved": "false", "types": "VULNERABILITY", "p": page, "ps": 100,
              })
              for issue in result["issues"]:
                  finding = {
                      "key": issue["key"], "rule": issue["rule"],
                      "severity": issue.get("severity"), "message": issue["message"],
                      "component": issue["component"], "line": issue.get("line"),
                      "creationDate": issue.get("creationDate"),
                  }
                  print("SECURITY_FINDING " + json.dumps(finding))
              if page * result["paging"]["pageSize"] >= result["paging"]["total"]:
                  break
              page += 1
          PY

  analysis:
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dependabot pull requests run with a restricted token and are not given
    # repository secrets, so SONAR_TOKEN is empty and `sonar` fails with
    # "Not authorized or project not found" on every bump — including ones
    # that change no dependency at all, which is why the upload-artifact bump
    # failed here too.
    #
    # Skipping the whole job rather than muting the failing step: this workflow
    # exists to run SonarCloud analysis, and without a token there is no
    # analysis to run. The coverage gate is not lost with it — ci.yml runs
    # `:api:check`, which depends on :api:jacocoTestCoverageVerification, on
    # every pull request including these. Keeping the job alive just to run
    # tests again would duplicate that, which is the same waste removed from
    # this file when :api:integrationTest was dropped.
    #
    # The alternative is storing SONAR_TOKEN as a Dependabot secret, which
    # hands the token to bot-triggered runs in order to analyze dependency
    # bumps. Not worth it.
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      # See ci.yml: the committed lockfiles are enforced by the build itself.
      # Never regenerate them here.
      # Deliberately does NOT run :api:integrationTest. Sonar reads coverage
      # from build/reports/jacoco/test/jacocoTestReport.xml, and
      # jacocoTestReport depends only on :api:test — the integrationTest task
      # writes separate execution data that never reaches the report. Running
      # it here spun up a second MySQL + Redis Testcontainers stack per pull
      # request for no analysis benefit; ci.yml still runs it.
      - name: Test and collect coverage
        run: ./gradlew clean :api:test :api:jacocoTestReport --no-daemon

      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: api/build/reports/jacoco/test

      - name: Report uncovered lines
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          for report in pathlib.Path('.').glob('**/jacocoTestReport.xml'):
              root = ET.parse(report).getroot()
              for package in root.findall('package'):
                  for source in package.findall('sourcefile'):
                      missed = [
                          line.get('nr')
                          for line in source.findall('line')
                          if int(line.get('mi', '0')) > 0
                      ]
                      if missed:
                          print(f"{report}: {package.get('name')}/{source.get('name')}: {', '.join(missed)}")
          PY

      - name: Verify coverage and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew :api:jacocoTestCoverageVerification sonar --no-daemon
