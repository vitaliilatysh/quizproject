name: SonarQube analysis

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true

      # See ci.yml: the committed lockfiles are enforced by the build itself.
      # Never regenerate them here.
      - name: Test and collect coverage
        run: ./gradlew clean :api:test :api:jacocoTestReport :api:integrationTest --no-daemon

      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jacoco-report
          path: api/build/reports/jacoco/test

      - name: Report uncovered lines
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          for report in pathlib.Path('.').glob('**/jacocoTestReport.xml'):
              root = ET.parse(report).getroot()
              for package in root.findall('package'):
                  for source in package.findall('sourcefile'):
                      missed = [
                          line.get('nr')
                          for line in source.findall('line')
                          if int(line.get('mi', '0')) > 0
                      ]
                      if missed:
                          print(f"{report}: {package.get('name')}/{source.get('name')}: {', '.join(missed)}")
          PY

      - name: Verify coverage and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew :api:jacocoTestCoverageVerification sonar --no-daemon
