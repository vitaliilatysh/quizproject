name: SonarQube analysis

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Refresh dependency lock state
        run: ./gradlew dependencies --write-locks --no-daemon && cat gradle.lockfile

      - name: Test and collect coverage
        run: ./gradlew clean test jacocoTestReport --no-daemon

      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test

      - name: Report uncovered lines
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("build/reports/jacoco/test/jacocoTestReport.xml").getroot()
          for package in root.findall("package"):
              for source in package.findall("sourcefile"):
                  missed = [
                      line.get("nr")
                      for line in source.findall("line")
                      if int(line.get("mi", "0")) > 0
                  ]
                  if missed:
                      print(f"{package.get('name')}/{source.get('name')}: {', '.join(missed)}")
          PY

      - name: Verify coverage and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew jacocoTestCoverageVerification sonar --no-daemon
