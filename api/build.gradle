plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ua.nure.latysh'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// Spring Boot 4.1.1 manages tomcat-embed-core 11.0.24, and 4.1.1 is the latest
// release on that line — so there is no Boot version to upgrade to. Three
// CRITICAL advisories land on 11.0.24, all of them authentication or access
// control bypasses in the server this API is served by:
//
//   CVE-2026-65182  security constraint bypass through improper access control
//   CVE-2026-65905  authentication bypass by replay in the DIGEST authenticator
//   CVE-2026-68525  unauthorized resource access via FORM authentication bypass
//
// Overriding the managed version is Boot's own supported mechanism for exactly
// this gap. Remove this once a Boot release manages 11.0.25 or later; the
// Trivy scan in container.yml is what will notice if it is removed too early.
ext['tomcat.version'] = '11.0.25'

dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('test') {
    useJUnitPlatform()
    exclude '**/*IntegrationTest.class'
    finalizedBy tasks.named('jacocoTestReport')
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs Spring Boot against a real MySQL database managed by Testcontainers.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*IntegrationTest.class'
    shouldRunAfter tasks.named('test')
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

jacoco {
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

// Three counters, the same three the web module gates: lines, methods and
// branches. Lines and methods are held at everything; branches are held by
// count rather than by ratio.
//
// A ratio would have been the obvious choice and it is the wrong one here.
// Exactly one branch in this module cannot be covered by any test:
//
//   AdminService.questionsWithAnswers   the `question != null` guard
//
// It builds a map of a quiz's questions and then walks that quiz's answers,
// from two queries scoped to the same quiz id inside one read-only
// REPEATABLE_READ transaction. Every answer's question is therefore already in
// the map, and the null the guard is written for cannot arrive. A ratio floor
// would let that one grow into five without anyone noticing; a count says how
// many are known to be unreachable, and fails the build on the next.
//
// It was two until AttemptService stopped rebuilding a quiz's questions to
// score an attempt and started reading the snapshot it was issued with. The
// second guard went with the method that held it, which is the ordinary way a
// number like this comes down: not by covering the branch, but by the code
// that needed it going away.
tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
            limit {
                counter = 'METHOD'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
            limit {
                counter = 'BRANCH'
                value = 'MISSEDCOUNT'
                maximum = 1
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
