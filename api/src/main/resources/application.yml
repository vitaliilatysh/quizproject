spring:
  application:
    name: quiz-api
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tests_db?characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  flyway:
    clean-disabled: true
    validate-on-migrate: true

server:
  port: ${API_PORT:8081}
  shutdown: graceful
  error:
    include-message: never

management:
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: ${READINESS_HEALTH_INDICATORS:readinessState,db,redis}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs

quiz:
  security:
    jwt-secret: ${JWT_SECRET}
    issuer: quiz-api
    token-ttl: ${JWT_TTL:PT15M}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    rate-limit:
      backend: ${RATE_LIMIT_BACKEND:redis}
      requests: ${API_RATE_LIMIT_REQUESTS:120}
      login-attempts: ${LOGIN_RATE_LIMIT_REQUESTS:5}
      window: ${API_RATE_LIMIT_WINDOW:PT1M}
      max-clients: ${API_RATE_LIMIT_MAX_CLIENTS:10000}
      trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}
