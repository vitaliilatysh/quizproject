spring:
  application:
    name: quiz-api
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tests_db?characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  flyway:
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${API_PORT:8081}
  shutdown: graceful
  compression:
    enabled: ${HTTP_COMPRESSION_ENABLED:true}
    min-response-size: ${HTTP_COMPRESSION_MIN_RESPONSE_SIZE:1KB}
    mime-types: application/json,application/problem+json,application/javascript,text/css,text/html,text/plain
  error:
    include-message: never

management:
  # Actuator is served on its own connector, not on the API port. /actuator/metrics
  # is administrator-only, but /actuator/prometheus has to stay open for the scraper
  # to reach it, and it publishes the same registry: every counter, the JVM build,
  # the connection pool, and a tag per request URI. Sharing a port meant whatever
  # reaches the API reaches those too. This port is not on the public Service, so
  # the boundary is the connector rather than a list of paths that has to be kept
  # right each time an endpoint is exposed.
  server:
    port: ${MANAGEMENT_PORT:9081}
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: ${READINESS_HEALTH_INDICATORS:readinessState,db,redis}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}

# The only two operational settings in this file that were not environment
# variables, and the pair with the widest blast radius: SecurityConfiguration
# permits both paths unauthenticated, so wherever they are enabled the full API
# surface — every route, schema and constraint — is published to anyone who can
# reach the port. That is wanted in development and is what HttpContractTest
# pins. Whether it is wanted in staging or production is a deployment's call,
# and until now making that call meant rebuilding the image.
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs

quiz:
  http:
    public-cache-max-age: ${PUBLIC_QUIZ_CACHE_MAX_AGE:PT1M}
  security:
    jwt-secret: ${JWT_SECRET}
    issuer: quiz-api
    token-ttl: ${JWT_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    rate-limit:
      backend: ${RATE_LIMIT_BACKEND:redis}
      requests: ${API_RATE_LIMIT_REQUESTS:120}
      login-attempts: ${LOGIN_RATE_LIMIT_REQUESTS:5}
      window: ${API_RATE_LIMIT_WINDOW:PT1M}
      max-clients: ${API_RATE_LIMIT_MAX_CLIENTS:10000}
      trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}
