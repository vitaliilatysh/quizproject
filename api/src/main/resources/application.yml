spring:
  application:
    name: quiz-api
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tests_db?characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1

server:
  port: ${API_PORT:8081}
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs

quiz:
  security:
    jwt-secret: ${JWT_SECRET}
    issuer: quiz-api
    token-ttl: ${JWT_TTL:PT15M}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    rate-limit:
      requests: ${API_RATE_LIMIT_REQUESTS:120}
      login-attempts: ${LOGIN_RATE_LIMIT_REQUESTS:5}
      window: ${API_RATE_LIMIT_WINDOW:PT1M}
      max-clients: ${API_RATE_LIMIT_MAX_CLIENTS:10000}
