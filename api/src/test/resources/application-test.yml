# An ephemeral actuator port. application.yml reads MANAGEMENT_PORT, so overriding
# the variable rather than management.server.port leaves the production wiring under
# test: drop that line from application.yml and local.management.port stops resolving.
# 0 rather than 9081 because two test JVMs on one CI runner would fight over a fixed one.
MANAGEMENT_PORT: 0

spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:quiz_api;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: false

quiz:
  security:
    jwt-secret: cDctdGVzdC1zZWNyZXQtbXVzdC1iZS1hdC1sZWFzdC0zMi1ieXRlcw==
    allowed-origins: https://app.example.test
    rate-limit:
      backend: memory
      requests: 100
      login-attempts: 3
      trusted-proxy-cidrs:
        - 10.0.0.0/8
        - 127.0.0.1/32
