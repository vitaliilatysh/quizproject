plugins {
    id 'base'
    id 'org.sonarqube' version '7.5.0.8588'
}

group = 'ua.nure.latysh'
version = '1.0-SNAPSHOT'

dependencyLocking {
    lockAllConfigurations()
}

// Keep an explicit lock state for the dependency-free aggregator project.
configurations {
    rootClasspath
}

sonar {
    properties {
        property 'sonar.projectKey', 'vitaliilatysh_quizproject'
        property 'sonar.organization', 'vitaliilatysh'
        property 'sonar.gradle.scanAll', 'true'
        property 'sonar.qualitygate.wait', 'true'
        property 'sonar.exclusions', 'api/src/main/resources/db/migration/**/*.sql'

        // scanAll brings the files under .github/scripts in as source, which is
        // what puts the production release gate in front of the analysis. It
        // also means SonarCloud needs a coverage report for them: with none,
        // verify_release.py read as 0% covered however well it was tested.
        // sonarqube.yml writes this one.
        property 'sonar.python.coverage.reportPaths', 'build/python-coverage.xml'

        // scanAll files only what sits in a Gradle test source set as a test;
        // everything else it collects is source, and it takes .github in whole.
        // So the gate's own tests are indexed as production code, uncovered.
        // They are excluded from coverage only — still analyzed for issues.
        // Setting sonar.tests instead would look like the fix and is not:
        // overriding sonar.sources or sonar.tests switches scanAll off, and
        // takes the workflows and scripts out of the analysis with it.
        property 'sonar.coverage.exclusions', '.github/scripts/test_*.py'
    }
}

project(':api') {
    sonar {
        properties {
            property 'sonar.coverage.jacoco.xmlReportPaths',
                    'build/reports/jacoco/test/jacocoTestReport.xml'
        }
    }
}

tasks.named('sonar') {
    dependsOn ':api:jacocoTestReport'
}
