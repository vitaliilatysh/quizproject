apiVersion: v1
kind: ConfigMap
metadata:
  name: quiz-api-config
  namespace: quizproject
  labels:
    app.kubernetes.io/name: quiz-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: quizproject
data:
  API_PORT: "8081"
  JWT_TTL: "PT15M"
  CORS_ALLOWED_ORIGINS: "https://quiz.example.com"
  API_RATE_LIMIT_REQUESTS: "120"
  LOGIN_RATE_LIMIT_REQUESTS: "5"
  API_RATE_LIMIT_WINDOW: "PT1M"
  API_RATE_LIMIT_MAX_CLIENTS: "10000"
  SHUTDOWN_TIMEOUT: "20s"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
