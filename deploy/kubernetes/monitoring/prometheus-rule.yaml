apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: quiz-api
  namespace: quizproject
  labels:
    app.kubernetes.io/name: quiz-api
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: quizproject
spec:
  # service="quiz-api-management", not "quiz-api". Prometheus labels a series with the
  # Service its ServiceMonitor selected, and the scrape moved to the management
  # connector's Service when actuator came off the API port. Left as "quiz-api" these
  # selectors match nothing: three alerts would go quiet, and QuizApiUnavailable, which
  # tests absent(), would fire and never stop.
  groups:
    - name: quiz-api.availability
      rules:
        - alert: QuizApiUnavailable
          expr: min_over_time(up{namespace="quizproject",service="quiz-api-management"}[2m]) == 0 or absent(up{namespace="quizproject",service="quiz-api-management"})
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Quiz API is unavailable
            description: Prometheus has been unable to scrape the Quiz API for two minutes.
        - alert: QuizApiHighServerErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace="quizproject",service="quiz-api-management",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{namespace="quizproject",service="quiz-api-management"}[5m])), 0.001)
            > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Quiz API has a high server error rate
            description: More than 5% of HTTP requests have returned 5xx responses for ten minutes.
        - alert: QuizApiHighLatency
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_server_requests_seconds_bucket{namespace="quizproject",service="quiz-api-management"}[5m])
              )
            ) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Quiz API latency is high
            description: The p95 server response time has exceeded one second for ten minutes.
        - alert: QuizRateLimiterUnavailable
          expr: |
            sum(rate(quiz_rate_limit_requests_total{namespace="quizproject",service="quiz-api-management",outcome="unavailable"}[5m])) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Quiz API rate limiter cannot reach Redis
            description: Rate-limit checks are failing closed because the Redis backend is unavailable.
