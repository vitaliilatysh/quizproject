apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: quiz-api
  namespace: quizproject
  labels:
    app.kubernetes.io/name: quiz-api
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: quizproject
spec:
  groups:
    - name: quiz-api.availability
      rules:
        - alert: QuizApiUnavailable
          expr: min_over_time(up{namespace="quizproject",service="quiz-api"}[2m]) == 0 or absent(up{namespace="quizproject",service="quiz-api"})
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Quiz API is unavailable
            description: Prometheus has been unable to scrape the Quiz API for two minutes.
        - alert: QuizApiHighServerErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace="quizproject",service="quiz-api",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{namespace="quizproject",service="quiz-api"}[5m])), 0.001)
            > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Quiz API has a high server error rate
            description: More than 5% of HTTP requests have returned 5xx responses for ten minutes.
        - alert: QuizApiHighLatency
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_server_requests_seconds_bucket{namespace="quizproject",service="quiz-api"}[5m])
              )
            ) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Quiz API latency is high
            description: The p95 server response time has exceeded one second for ten minutes.
        - alert: QuizRateLimiterUnavailable
          expr: |
            sum(rate(quiz_rate_limit_requests_total{namespace="quizproject",service="quiz-api",outcome="unavailable"}[5m])) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Quiz API rate limiter cannot reach Redis
            description: Rate-limit checks are failing closed because the Redis backend is unavailable.
