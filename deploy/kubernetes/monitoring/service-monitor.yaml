apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: quiz-api
  namespace: quizproject
  labels:
    app.kubernetes.io/name: quiz-api
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: quizproject
spec:
  namespaceSelector:
    matchNames:
      - quizproject
  selector:
    matchLabels:
      app.kubernetes.io/name: quiz-api
      app.kubernetes.io/component: management
  endpoints:
    # The management connector, not the API one. Actuator is not served on the
    # port the quiz-api Service publishes, so scraping there now gets nothing.
    - port: management
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
